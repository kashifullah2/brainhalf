<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainHalf — AI Document Extraction for Invoices, Receipts & Documents</title>
    <meta name="description" content="BrainHalf automatically extracts fields, line items, and totals from invoices, receipts, forms, and transcripts using AI data extraction with BH Model 1. No templates required. Export to CSV, Excel & JSON instantly." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="BrainHalf" />
    <meta name="theme-color" content="#fbf9f5" />
    <meta name="theme-color" content="#1d1815" media="(prefers-color-scheme: dark)" />
    <!-- Dynamic canonical tag managed by usePageSeo in React -->
    
    <!-- Alternate spellings / brand variations -->
    <meta name="application-name" content="BrainHalf" />
    <meta name="apple-mobile-web-app-title" content="BrainHalf" />

    <!-- OpenGraph -->
    <meta property="og:title" content="BrainHalf — AI Document Extraction for Invoices & Receipts" />
    <meta property="og:description" content="BrainHalf automatically extracts fields, line items, and totals from invoices, receipts, and transcripts using BH Model 1. No templates needed — just drag, drop, and export clean data." />
    <meta property="og:url" content="https://brainhalf.com/" />
    <meta property="og:site_name" content="BrainHalf" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://brainhalf.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BrainHalf AI Document Extraction Platform — Extract data from invoices and receipts automatically" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrainHalf — AI Document Extraction Automation" />
    <meta name="twitter:description" content="Turn messy stacks of invoices and receipts into clean, structured data in seconds with BrainHalf's AI document extraction platform." />
    <meta name="twitter:image" content="https://brainhalf.com/og-image.png" />
    <meta name="twitter:image:alt" content="BrainHalf AI Document Extraction Platform" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf", "Brainhalf"],
      "url": "https://brainhalf.com",
      "logo": "https://brainhalf.com/favicon.svg",
      "description": "AI-powered document extraction platform for instant invoice, receipt, and document data extraction.",
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf"],
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Document Processing",
      "operatingSystem": "WebBrowser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "description": "BrainHalf is an AI document extraction platform that automatically extracts data from invoices, receipts, handwritten notes, multilingual documents, and more using proprietary BH Model 1. Supports custom schemas, batch processing, and instant CSV/Excel/JSON export.",
      "url": "https://brainhalf.com/",
      "featureList": [
        "AI-powered invoice document extraction",
        "Receipt data capture and parsing",
        "Handwriting recognition (cursive, print, mixed)",
        "Multilingual document extraction with English translation",
        "Visual Question Answering (VQA)",
        "Custom extraction schemas",
        "Batch document processing",
        "Export to CSV, Excel & JSON",
        "BH Model 1 engine",
        "Adaptive AI extraction pipeline"
      ],
      "screenshot": "https://brainhalf.com/og-image.png"
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf"],
      "url": "https://brainhalf.com"
    }
    </script>

    <!-- JSON-LD: FAQPage — must match the visible FAQ on the homepage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Which file types does BrainHalf support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PDFs up to 14 MB and images (JPG, PNG, WEBP) up to 25 MB. A PDF is sent to the model whole, which is what makes its limit the lower of the two; photos and scans are resized in your browser first."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to build a template for every document layout?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Pick a preset — Invoice, Receipt, Table, Key-Value, Handwriting, Multilingual or Full Text — or write your own prompt. The extraction engine reads each page directly, so new vendors and layouts work without any setup."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when a field is extracted incorrectly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every field carries a confidence score. Double-click any cell to correct it inline, and documents below your confidence threshold are collected in a review queue so nothing slips through."
          }
        },
        {
          "@type": "Question",
          "name": "Which export formats are available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CSV, Excel (.xlsx) and JSON. Export a single batch or bulk-export several runs at once."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data kept private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Documents and extracted data are tied to your account only. Delete any batch from your dashboard, or the whole account from Settings \u2192 Data & Privacy, and the documents, extracted fields and stored files go with it immediately. You can also download everything as JSON first. Details are in our privacy policy."
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Requested here, not via `@import url(...)` in index.css: an @import
         makes the font CSS a serial round trip behind our own stylesheet.
         Keep this list identical to the --app-font-* stacks in index.css. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <noscript>
      BrainHalf needs JavaScript to extract data from your documents. Please
      enable it and reload this page.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
