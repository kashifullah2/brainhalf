  <head>
    <meta charset="UTF-8" />

    <title>BrainHalf — AI Document Extraction for Invoices, Receipts & Documents</title>
    <meta name="description" content="BrainHalf automatically extracts fields, line items, and totals from invoices, receipts, forms, and transcripts using AI data extraction with BH Model 1 and BH Model 2. No templates required. Export to CSV, Excel & JSON instantly." />

    <meta name="theme-color" content="#1e1815" media="(prefers-color-scheme: dark)" />
    <!-- Dynamic canonical tag managed by usePageSeo in React -->
    
    <!-- Alternate spellings / brand variations -->
    <meta name="application-name" content="BrainHalf" />
    <meta name="apple-mobile-web-app-title" content="BrainHalf" />

    <!-- OpenGraph -->
    <meta property="og:title" content="BrainHalf — AI Document Extraction for Invoices & Receipts" />
    <meta property="og:description" content="BrainHalf automatically extracts fields, line items, and totals from invoices, receipts, and transcripts using BH Model 1 and BH Model 2. No templates needed — just drag, drop, and export clean data." />
    <meta property="og:url" content="https://brainhalf.com/" />
    <meta property="og:site_name" content="BrainHalf" />

    <meta name="twitter:title" content="BrainHalf — AI Document Extraction Automation" />
    <meta name="twitter:description" content="Turn messy stacks of invoices and receipts into clean, structured data in seconds with BrainHalf's AI document extraction platform." />

    <meta name="twitter:image:alt" content="BrainHalf AI Document Extraction Platform" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf", "Brainhalf"],
      "url": "https://brainhalf.com",
      "logo": "https://brainhalf.com/favicon.svg",
      "description": "AI-powered document extraction platform for instant invoice, receipt, and document data extraction.",
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf"],
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Document Processing",
      "operatingSystem": "WebBrowser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "description": "BrainHalf is an AI document extraction platform that automatically extracts data from invoices, receipts, handwritten notes, multilingual documents, and more using proprietary BH Model 1 and BH Model 2. Supports custom schemas, batch processing, and instant CSV/Excel/JSON export.",
      "url": "https://brainhalf.com/",
      "featureList": [
        "AI-powered invoice document extraction",
        "Receipt data capture and parsing",
        "Handwriting recognition (cursive, print, mixed)",
        "Multilingual document extraction (50+ languages)",
        "Visual Question Answering (VQA)",
        "Custom extraction schemas",
        "Batch document processing",
        "Export to CSV, Excel & JSON",
        "BH Model 1 & BH Model 2 engines",
        "Adaptive AI extraction pipeline"
      ],
      "screenshot": "https://brainhalf.com/og-image.png"
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrainHalf",
      "alternateName": ["Brain Half", "brainhalf"],
      "url": "https://brainhalf.com"
    }
    </script>

    <!-- JSON-LD: FAQPage — must match the visible FAQ on the homepage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Which file types does BrainHalf support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "JPG, PNG, WEBP and PDF, up to 25 MB per file. Photos, scans and exported PDFs all work."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to build a template for every document layout?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Pick a preset such as Invoice, Receipt, Table or Handwriting, or write a custom prompt. The extraction engine reads each page directly, so new vendors and layouts work without any setup."
          }
        },
        {
          "@type": "Question",
          "name": "What happens when a field is extracted incorrectly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every field carries a confidence score. Double-click any cell to correct it inline, and documents below your confidence threshold are collected in a review queue so nothing slips through."
          }
        },
        {
          "@type": "Question",
          "name": "Which export formats are available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CSV, Excel (.xlsx) and JSON. Export a single batch or bulk-export several runs at once."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data kept private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Documents and extracted data are tied to your account only, and you can delete them at any time from Settings → Data & Privacy. Details are in our privacy policy."
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <noscript>
      BrainHalf needs JavaScript to extract data from your documents. Please
      enable it and reload this page.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
