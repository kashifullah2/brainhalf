<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waypoint - Team Travel Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2v20M2 12h20"/>
        </svg>
        <span>Waypoint</span>
      </div>
      <div class="auth-area">
        <span id="user-email" class="user-email"></span>
        <a href="/api/auth/google/start" id="signin-link" class="btn btn-outline">Sign in</a>
        <button id="logout-btn" class="btn btn-outline hidden">Sign out</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div id="loading-state" class="state-message">Loading...</div>
    <div id="error-state" class="state-message error hidden" role="alert"></div>
    
    <div id="signed-out-view" class="view hidden">
      <div class="welcome-card">
        <h1>Plan your next journey together</h1>
        <p>Sign in to create trips, invite teammates, and manage bookings and expenses.</p>
        <a href="/api/auth/google/start" class="btn btn-primary">Sign in with Google</a>
      </div>
    </div>

    <div id="signed-in-view" class="view hidden">
      <section class="section">
        <h2>Your Trips</h2>
        <form id="create-trip-form" class="form-row">
          <label for="trip-title">Trip title</label>
          <input type="text" id="trip-title" required maxlength="120" placeholder="e.g. Summer Retreat">
          <label for="trip-capacity">Capacity</label>
          <input type="number" id="trip-capacity" required min="1" max="100" value="10">
          <label for="trip-budget">Budget ($)</label>
          <input type="number" id="trip-budget" required min="0" max="1000000" step="0.01" value="1000">
          <button type="submit" class="btn btn-primary" id="create-trip-btn">Create Trip</button>
        </form>
        <div id="trips-list" class="trips-list"></div>
        <div id="trips-empty" class="state-message hidden">No trips yet. Create your first trip above.</div>
      </section>

      <section class="section">
        <h2>Saved Destinations</h2>
        <form id="add-item-form" class="form-row">
          <label for="item-title">Destination</label>
          <input type="text" id="item-title" required maxlength="120" placeholder="e.g. Kyoto, Japan">
          <button type="submit" class="btn btn-primary" id="add-item-btn">Save</button>
        </form>
        <div id="items-list" class="items-list"></div>
        <div id="items-empty" class="state-message hidden">No saved destinations yet.</div>
      </section>

      <section id="trip-detail-section" class="section hidden">
        <h2 id="trip-detail-title">Trip Details</h2>
        <div id="trip-detail-content"></div>
      </section>

      <section class="section">
        <h2>Contact Us</h2>
        <form id="contact-form" class="form-column">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" required>
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" required>
          <label for="contact-message">Message</label>
          <textarea id="contact-message" required rows="4"></textarea>
          <button type="submit" class="btn btn-primary" id="contact-btn">Send Message</button>
        </form>
        <div id="contact-result" class="contact-result hidden" role="status"></div>
      </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
