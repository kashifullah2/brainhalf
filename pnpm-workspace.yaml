# Workspace members. Without this key pnpm treats the repo as a single package and
# `pnpm install` never installs queue-worker/ at all -- which is why its
# node_modules did not exist and its `wrangler deploy` fell through to whatever
# binary happened to be on PATH.
packages:
  - '.'
  - 'queue-worker'

# pnpm 10 blocks dependency install scripts by default. These three need theirs:
# workerd is the local Workers runtime `wrangler pages dev` and
# `wrangler d1 migrations apply --local` run against, and it fetches its platform
# binary in a postinstall -- without this the binary is simply absent and local
# full-stack dev fails. esbuild is what wrangler bundles the Functions with.
#
# Deliberately a short allowlist rather than `dangerouslyAllowAllBuilds`: these are
# the only packages in the tree that need to execute anything at install time.
onlyBuiltDependencies:
  - esbuild
  - workerd

catalog:
  # Exact, not a range: this is the binary that bundles and uploads the Functions,
  # so a floating minor would make two deploys of the same commit non-identical.
  # queue-worker used to declare ^3.0.0 -- a different major from the 4.x actually
  # in use, on a package whose config resolution changed between the two.
  wrangler: 4.122.0
  '@cloudflare/workers-types': ^5.20260814.1
  '@replit/vite-plugin-cartographer': ^0.6.1
  '@replit/vite-plugin-dev-banner': ^0.1.2
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.0.0
  '@tanstack/react-query': ^5.60.5
  '@types/node': ^20.16.11
  '@types/react': ^18.3.11
  '@types/react-dom': ^18.3.1
  '@vitejs/plugin-react': ^4.3.2
  class-variance-authority: ^0.7.0
  clsx: ^2.1.1
  lucide-react: ^0.453.0
  react: ^18.3.1
  react-dom: ^18.3.1
  tailwind-merge: ^2.5.4
  tailwindcss: ^4.0.0
  # queue-worker declared ^5.0.0 against the root's ^7.0.2. It already compiled
  # under 7 -- it was resolving the root's copy, having none of its own.
  typescript: ^7.0.2
  vite: ^6.4.3
