name = "brainhalf"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "brainhalf.com", custom_domain = true },
  { pattern = "www.brainhalf.com", custom_domain = true }
]
[assets]
directory = "dist"
binding = "ASSETS"

[ai]
binding = "AI"

[observability.traces]
enabled = true
head_sampling_rate = 0.05


[[durable_objects.bindings]]
name = "ChatAgent"
class_name = "ChatAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatAgent"]



